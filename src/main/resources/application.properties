spring.application.name=brasa-sal-api
server.port=8080

# ---- Banco de dados (valores vêm de variáveis de ambiente) ----
# DB_PASSWORD não tem valor padrão de propósito: nenhuma senha fica no código.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brasa_sal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate ----
# 'update' cria/ajusta as tabelas automaticamente (bom para desenvolvimento).
# Em produção o ideal é 'validate' + migrations (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
